# Azure DevOps Pipeline: Microservices Website Deployment to AKS
# This snippet shows the key stages for deploying a microservices-based website on Kubernetes

# Prerequisites:
# - Terraform apply pipeline has run and created AKS, ACR, Key Vault
# - MongoDB Atlas cluster is provisioned and connection string is available
# - Variable group "Mongo-secrets" exists with: mongo-connection-string, mongodb-api-key, jwt_key

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - client/**
      - order/**
      - payment/**
      - product/**
      - user/**
      - expiration/**
      - infra/k8s/**

parameters:
  - name: azureSubscription
    displayName: Azure svc conn
    type: string
    default: 'sc-azure-terraform'
  - name: acrServiceConnection
    displayName: ACR svc conn
    type: string
    default: 'acr-service-connection'
  - name: acrLoginServer
    displayName: ACR registry
    type: string
    default: 'microservicesdevcinjd6s.azurecr.io'
  - name: aksClusterName
    displayName: AKS name
    type: string
    default: 'aks-microservices-dev-cin-jd6s'
  - name: aksResourceGroup
    displayName: AKS RG
    type: string
    default: 'rg-microservices-dev-cin-jd6s'
  - name: kubernetesNamespace
    displayName: Namespace
    type: string
    default: 'production'

variables:
  - group: Mongo-secrets

stages:
  # ====== STAGE 1: Build & Push Microservice Images to ACR ======
  - stage: BuildAndPush
    displayName: 'Build and Push Images'
    jobs:
      - job: BuildImages
        displayName: 'Build Docker Images'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Log in to ACR
          - task: Docker@2
            displayName: 'Log in to ACR'
            inputs:
              command: 'login'
              containerRegistry: '${{ parameters.acrServiceConnection }}'

          # Build and push each service image
          - task: Docker@2
            displayName: 'Build and Push Product Service'
            inputs:
              command: 'buildAndPush'
              repository: 'product'
              dockerfile: 'product/Dockerfile'
              containerRegistry: '${{ parameters.acrServiceConnection }}'
              tags: |
                latest
                $(Build.BuildId)

          - task: Docker@2
            displayName: 'Build and Push Order Service'
            inputs:
              command: 'buildAndPush'
              repository: 'order'
              dockerfile: 'order/Dockerfile'
              containerRegistry: '${{ parameters.acrServiceConnection }}'
              tags: |
                latest
                $(Build.BuildId)

          - task: Docker@2
            displayName: 'Build and Push User Service'
            inputs:
              command: 'buildAndPush'
              repository: 'user'
              dockerfile: 'user/Dockerfile'
              containerRegistry: '${{ parameters.acrServiceConnection }}'
              tags: |
                latest
                $(Build.BuildId)

          - task: Docker@2
            displayName: 'Build and Push Payment Service'
            inputs:
              command: 'buildAndPush'
              repository: 'payment'
              dockerfile: 'payment/Dockerfile'
              containerRegistry: '${{ parameters.acrServiceConnection }}'
              tags: |
                latest
                $(Build.BuildId)

          - task: Docker@2
            displayName: 'Build and Push Client (Next.js)'
            inputs:
              command: 'buildAndPush'
              repository: 'client'
              dockerfile: 'client/Dockerfile'
              containerRegistry: '${{ parameters.acrServiceConnection }}'
              tags: |
                latest
                $(Build.BuildId)

          - task: Docker@2
            displayName: 'Build and Push Expiration Service'
            inputs:
              command: 'buildAndPush'
              repository: 'expiration'
              dockerfile: 'expiration/Dockerfile'
              containerRegistry: '${{ parameters.acrServiceConnection }}'
              tags: |
                latest
                $(Build.BuildId)

          # Validate pushed images in ACR before deployment starts
          - task: AzureCLI@2
            displayName: 'Validate ACR Images'
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail

                REGISTRY_NAME="${{ parameters.acrLoginServer }}"
                REGISTRY_NAME="${REGISTRY_NAME%%.azurecr.io}"

                echo "Validating images in ACR: ${REGISTRY_NAME}"
                echo "Expected build tag: $(Build.BuildId)"

                az acr repository list --name "$REGISTRY_NAME" -o table

                for repo in product order user payment client expiration; do
                  echo "--- ${repo} tags ---"
                  az acr repository show-tags \
                    --name "$REGISTRY_NAME" \
                    --repository "$repo" \
                    --orderby time_desc \
                    -o table

                  if ! az acr repository show-tags \
                    --name "$REGISTRY_NAME" \
                    --repository "$repo" \
                    --query "[?@=='$(Build.BuildId)']" \
                    -o tsv | grep -q "$(Build.BuildId)"; then
                    echo "##vso[task.logissue type=error]Missing build tag $(Build.BuildId) for ${repo} in ACR."
                    exit 1
                  fi
                done

                echo "✓ ACR image validation passed"

  # ====== STAGE 2: Create Kubernetes Secrets for the Website ======
  - stage: CreateSecrets
    displayName: 'Create Kubernetes Secrets'
    dependsOn: BuildAndPush
    jobs:
      - deployment: DeploySecrets
        displayName: 'Deploy Secrets to AKS'
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                # Ensure namespace exists before creating secrets
                - task: AzureCLI@2
                  displayName: 'Create Namespace'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials \
                        --resource-group ${{ parameters.aksResourceGroup }} \
                        --name ${{ parameters.aksClusterName }} \
                        --admin \
                        --overwrite-existing

                      kubectl create namespace ${{ parameters.kubernetesNamespace }} --dry-run=client -o yaml | kubectl apply -f -
                      echo "✓ Namespace created/verified"

                # Get AKS credentials
                - task: AzureCLI@2
                  displayName: 'Get AKS Credentials'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      az aks get-credentials \
                        --resource-group ${{ parameters.aksResourceGroup }} \
                        --name ${{ parameters.aksClusterName }} \
                        --admin \
                        --overwrite-existing

                # Create mongo-secret from MongoDB Atlas connection string
                - task: AzureCLI@2
                  displayName: 'Create mongo-secret'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      # Create mongo-secret with all service database URIs pointing to Atlas
                      kubectl create secret generic mongo-secret \
                        --from-literal=MONGO_URI_PRODUCT="$(mongo-connection-string)" \
                        --from-literal=MONGO_URI_ORDER="$(mongo-connection-string)" \
                        --from-literal=MONGO_URI_USER="$(mongo-connection-string)" \
                        --from-literal=MONGO_URI_PAYMENT="$(mongo-connection-string)" \
                        --namespace ${{ parameters.kubernetesNamespace }} \
                        --dry-run=client -o yaml | kubectl apply -f -

                      echo "✓ mongo-secret created/updated"

                # Create jwt-secret
                - task: AzureCLI@2
                  displayName: 'Create jwt-secret'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      kubectl create secret generic jwt-secret \
                        --from-literal=JWT_KEY="$(jwt_key)" \
                        --namespace ${{ parameters.kubernetesNamespace }} \
                        --dry-run=client -o yaml | kubectl apply -f -

                      echo "✓ jwt-secret created/updated"

                # Create stripe-secret (required by payment service)
                - task: AzureCLI@2
                  displayName: 'Create stripe-secret'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail

                      if [[ -z "$(stripe_key)" ]]; then
                        echo "##vso[task.logissue type=error]Pipeline variable stripe_key is empty. Add it in variable group Mongo-secrets."
                        exit 1
                      fi

                      kubectl create secret generic stripe-secret \
                        --from-literal=STRIPE_KEY="$(stripe_key)" \
                        --namespace ${{ parameters.kubernetesNamespace }} \
                        --dry-run=client -o yaml | kubectl apply -f -

                      echo "✓ stripe-secret created/updated"

                # Create paypal-secret (required by payment service)
                - task: AzureCLI@2
                  displayName: 'Create paypal-secret'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail

                      if [[ -z "$(paypal_client_id)" ]]; then
                        echo "##vso[task.logissue type=error]Pipeline variable paypal_client_id is empty. Add it in variable group Mongo-secrets."
                        exit 1
                      fi

                      kubectl create secret generic paypal-secret \
                        --from-literal=PAYPAL_CLIENT_ID="$(paypal_client_id)" \
                        --namespace ${{ parameters.kubernetesNamespace }} \
                        --dry-run=client -o yaml | kubectl apply -f -

                      echo "✓ paypal-secret created/updated"

                # Verify secrets
                - task: AzureCLI@2
                  displayName: 'Verify Secrets'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      echo "Secrets in cluster:"
                      kubectl get secrets -n ${{ parameters.kubernetesNamespace }}

  # ====== STAGE 3: Deploy Microservices to Kubernetes ======
  - stage: DeployServices
    displayName: 'Deploy to Kubernetes'
    dependsOn: CreateSecrets
    jobs:
      - job: PrepareDeployment
        displayName: 'Prepare Manifests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # Update image references in k8s manifests to use ACR
          - task: Bash@3
            displayName: 'Update K8s Manifests with ACR Images'
            inputs:
              targetType: 'inline'
              script: |
                # Replace placeholder image references with ACR login server
                for file in infra/k8s/*-depl.yaml; do
                  # Skip in-cluster MongoDB manifests
                  if [[ "$file" == *"-mongo-depl.yaml" ]]; then
                    continue
                  fi
                  
                  sed -i "s|thasup/product|${{ parameters.acrLoginServer }}/product:$(Build.BuildId)|g" "$file"
                  sed -i "s|thasup/order|${{ parameters.acrLoginServer }}/order:$(Build.BuildId)|g" "$file"
                  sed -i "s|thasup/payment|${{ parameters.acrLoginServer }}/payment:$(Build.BuildId)|g" "$file"
                  sed -i "s|thasup/user|${{ parameters.acrLoginServer }}/user:$(Build.BuildId)|g" "$file"
                  sed -i "s|thasup/expiration|${{ parameters.acrLoginServer }}/expiration:$(Build.BuildId)|g" "$file"
                  sed -i "s|thasup/client|${{ parameters.acrLoginServer }}/client:$(Build.BuildId)|g" "$file"
                done
                echo "✓ Manifests updated with ACR images"

          # Validate rewritten images before publishing manifests
          - task: Bash@3
            displayName: 'Validate Rewritten Manifest Images'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail

                echo "Validating rewritten image references..."
                echo "Expected registry: ${{ parameters.acrLoginServer }}"

                if grep -RIn "thasup/" infra/k8s/*-depl.yaml; then
                  echo "##vso[task.logissue type=error]Placeholder image references still exist in manifests."
                  exit 1
                fi

                if ! grep -RIn "${{ parameters.acrLoginServer }}" infra/k8s/*-depl.yaml >/dev/null; then
                  echo "##vso[task.logissue type=error]ACR image references were not written to manifests."
                  exit 1
                fi

                for file in infra/k8s/*-depl.yaml; do
                  echo "--- $file ---"
                  grep -n "image:" "$file" || true
                done

                echo "✓ Manifest image validation passed"

          # Publish updated manifests as artifact
          - publish: $(System.DefaultWorkingDirectory)/infra/k8s
            artifact: k8s-manifests-$(Build.BuildId)
            displayName: 'Publish Updated Manifests'

      - deployment: DeployApp
        displayName: 'Deploy to AKS'
        dependsOn: PrepareDeployment
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: k8s-manifests-$(Build.BuildId)

                # Get AKS credentials
                - task: AzureCLI@2
                  displayName: 'Get AKS Credentials'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group ${{ parameters.aksResourceGroup }} \
                        --name ${{ parameters.aksClusterName }} \
                        --admin \
                        --overwrite-existing

                # Attach ACR to AKS so the cluster can pull images
                - task: AzureCLI@2
                  displayName: 'Attach ACR to AKS'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      ACR_NAME="${{ parameters.acrLoginServer }}"
                      ACR_NAME="${ACR_NAME%%.azurecr.io}"

                      az aks update \
                        --resource-group ${{ parameters.aksResourceGroup }} \
                        --name ${{ parameters.aksClusterName }} \
                        --attach-acr "$ACR_NAME"

                      echo "AKS kubelet identity:"
                      az aks show \
                        --resource-group ${{ parameters.aksResourceGroup }} \
                        --name ${{ parameters.aksClusterName }} \
                        --query "identityProfile.kubeletidentity.objectId" \
                        -o tsv

                      echo "ACR attached: $ACR_NAME"

                # Create namespace
                - task: AzureCLI@2
                  displayName: 'Create Namespace'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      kubectl create namespace ${{ parameters.kubernetesNamespace }} --dry-run=client -o yaml | kubectl apply -f -
                      echo "✓ Namespace created/verified"

                # Deploy services (skip in-cluster MongoDB)
                - task: AzureCLI@2
                  displayName: 'Deploy Microservices'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      MANIFEST_DIR="$(Pipeline.Workspace)/k8s-manifests-$(Build.BuildId)"
                      
                      echo "Deploying NATS..."
                      kubectl apply -f "$MANIFEST_DIR/nats-depl.yaml" -n ${{ parameters.kubernetesNamespace }}

                      echo "Deploying Expiration service (Redis)..."
                      kubectl apply -f "$MANIFEST_DIR/expiration-redis-depl.yaml" -n ${{ parameters.kubernetesNamespace }}
                      kubectl apply -f "$MANIFEST_DIR/expiration-depl.yaml" -n ${{ parameters.kubernetesNamespace }}

                      echo "Deploying microservices..."
                      kubectl apply -f "$MANIFEST_DIR/product-depl.yaml" -n ${{ parameters.kubernetesNamespace }}
                      kubectl apply -f "$MANIFEST_DIR/order-depl.yaml" -n ${{ parameters.kubernetesNamespace }}
                      kubectl apply -f "$MANIFEST_DIR/user-depl.yaml" -n ${{ parameters.kubernetesNamespace }}
                      kubectl apply -f "$MANIFEST_DIR/payment-depl.yaml" -n ${{ parameters.kubernetesNamespace }}
                      kubectl apply -f "$MANIFEST_DIR/client-depl.yaml" -n ${{ parameters.kubernetesNamespace }}

                      echo "✓ All services deployed"

                # Verify deployments
                - task: AzureCLI@2
                  displayName: 'Verify Deployments'
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      echo "Checking deployment status..."
                      kubectl get deployments -n ${{ parameters.kubernetesNamespace }}
                      kubectl get pods -n ${{ parameters.kubernetesNamespace }}

                      for deployment in client-depl expiration-depl expiration-redis-depl nats-depl order-depl payment-depl product-depl user-depl; do
                        echo "Waiting for rollout: ${deployment}"
                        kubectl rollout status deployment/${deployment} -n ${{ parameters.kubernetesNamespace }} --timeout=300s
                      done

                      echo "Cleaning up old ReplicaSet pods that are no longer part of the active rollout..."
                      kubectl get pods -n ${{ parameters.kubernetesNamespace }} --no-headers \
                        | awk '$3 ~ /ImagePullBackOff|ErrImagePull|CrashLoopBackOff|CreateContainerConfigError/ { print $1 }' \
                        | xargs -r kubectl delete pod -n ${{ parameters.kubernetesNamespace }} --ignore-not-found

                      echo "✓ Deployments verified"
