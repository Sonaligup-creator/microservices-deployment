apiVersion: skaffold/v2beta29
kind: Config
deploy:
  kubectl:
    remoteManifests:
      - ./infra/k8s/*
      - ./infra/k8s-dev/*
build:
  # uncomment this if you want to run on docker desktop
  local:
    push: false
  # uncomment this if you want to run on google cloud platform
  # googleCloudBuild:
  #   projectId: ecommercewebsite.me-shop-367317
  artifacts:
    # uncomment this if you want to run on docker desktop
    - image: ecommerce/user
    # uncomment this if you want to run on google cloud platform
    # - image: us.gcr.io/ecommercewebsite.me-shop-367317/user
      context: user
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    # uncomment this if you want to run on docker desktop
    - image: ecommerce/client
    # uncomment this if you want to run on google cloud platform
    # - image: us.gcr.io/ecommercewebsite.me-shop-367317/client
      context: client
      docker:
        dockerfile: dev.Dockerfile
      sync:
        manual:
          - src: "**/*.js"
            dest: .
          - src: "**/*.css"
            dest: .
          - src: "**/*.jpg"
            dest: .
          - src: "**/*.png"
            dest: .
    # uncomment this if you want to run on docker desktop
    - image: ecommerce/product
    # uncomment this if you want to run on google cloud platform
    # - image: us.gcr.io/ecommercewebsite.me-shop-367317/product
      context: product
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    # uncomment this if you want to run on docker desktop
    - image: ecommerce/order
    # uncomment this if you want to run on google cloud platform
    # - image: us.gcr.io/ecommercewebsite.me-shop-367317/order
      context: order
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    # uncomment this if you want to run on docker desktop
    - image: ecommerce/expiration
    # uncomment this if you want to run on google cloud platform
    # - image: us.gcr.io/ecommercewebsite.me-shop-367317/expiration
      context: expiration
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    # uncomment this if you want to run on docker desktop
    - image: ecommerce/payment
    # uncomment this if you want to run on google cloud platform
    # - image: us.gcr.io/ecommercewebsite.me-shop-367317/payment
      context: payment
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .

